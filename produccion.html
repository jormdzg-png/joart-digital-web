<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070A14">
<title>Joart Producción</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{
    --bg:#070A14; --panel:rgba(16,23,44,.78); --panel2:rgba(255,255,255,.035);
    --line:rgba(242,204,143,.20); --line-hi:rgba(var(--terra-rgb),.65);
    --terra-rgb:224,122,95; --sand:#F2CC8F; --terra:#E07A5F; --terra-d:#C4603F; --sage:#81B29A; --ink:#ECE8D6; --mute:#8E96B2; --danger:#FF8272;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --disp:'Archivo Expanded','Inter',sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html{ color-scheme:dark; }
  body{ margin:0; min-height:100vh; color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 520px at 50% -8%, #1B2547 0%, transparent 62%), radial-gradient(600px 420px at 100% 100%, rgba(var(--terra-rgb),.10), transparent 60%), var(--bg); background-attachment:fixed; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
    background-image:linear-gradient(rgba(242,204,143,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(242,204,143,.05) 1px, transparent 1px);
    background-size:44px 44px; -webkit-mask-image:radial-gradient(ellipse at 50% 20%, #000 0%, transparent 72%); mask-image:radial-gradient(ellipse at 50% 20%, #000 0%, transparent 72%); }
  .wrap{ position:relative; z-index:1; width:100%; max-width:640px; margin:0 auto; padding:14px 16px calc(150px + env(safe-area-inset-bottom)); }

  /* ---------- encabezado ---------- */
  .top{ display:flex; align-items:center; gap:12px; padding:6px 0 10px; }
  .core-logo{ width:42px; height:42px; flex:none; }
  .top b{ display:block; font:800 15px var(--disp); letter-spacing:.12em; }
  .top small{ display:block; font:400 10.5px var(--mono); color:var(--mute); letter-spacing:.14em; text-transform:uppercase; margin-top:2px; }
  .online{ margin-left:auto; display:flex; align-items:center; gap:7px; font:600 10px var(--mono); letter-spacing:.14em; color:var(--sage); }
  .online i{ width:7px; height:7px; border-radius:50%; background:var(--sage); box-shadow:0 0 10px var(--sage); animation:pulso 2.2s ease-in-out infinite; }
  .online.off{ color:var(--danger); } .online.off i{ background:var(--danger); box-shadow:0 0 10px var(--danger); animation:none; }
  @keyframes pulso{ 50%{ opacity:.35; transform:scale(.8); } }
  @keyframes gira{ to{ transform:rotate(360deg); } }
  .saludo{ font:800 21px var(--disp); margin:6px 0 4px; }
  .hint{ font-size:12px; color:var(--mute); line-height:1.45; }
  .tools{ display:flex; justify-content:flex-end; gap:6px; margin:-4px 0 4px; }
  .link{ background:none; border:none; color:var(--terra); font:600 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; cursor:pointer; padding:12px 8px; min-height:44px; }

  .tabs{ display:flex; position:sticky; top:0; z-index:20; margin:8px -16px 14px; padding:0 8px; background:linear-gradient(var(--bg) 70%, transparent); backdrop-filter:blur(8px); }
  .tab{ flex:1; background:none; border:none; color:var(--mute); padding:15px 6px; font:600 11.5px var(--mono); letter-spacing:.16em; cursor:pointer; position:relative; text-transform:uppercase; min-height:48px; }
  .tab::after{ content:""; position:absolute; left:18%; right:18%; bottom:4px; height:2px; background:var(--terra); box-shadow:0 0 12px var(--terra); transform:scaleX(0); transition:transform .25s; }
  .tab.on{ color:var(--sand); } .tab.on::after{ transform:scaleX(1); }
  .pane{ animation:entra .35s ease both; }
  @keyframes entra{ from{ opacity:0; transform:translateY(8px); } }

  .chips{ display:flex; gap:8px; margin-bottom:12px; }
  .chip{ min-height:40px; border:1px solid var(--line); background:transparent; color:var(--mute); padding:0 14px; font:600 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; cursor:pointer; }
  .chip.on{ color:var(--sand); border-color:var(--sand); background:rgba(242,204,143,.08); }

  /* ---------- lista de pedidos ---------- */
  .proj{ display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:13px 14px; margin-bottom:8px; cursor:pointer; font:inherit; transition:all .2s; }
  .proj:hover, .proj:active{ border-color:var(--line-hi); box-shadow:-3px 0 0 var(--terra); }
  .proj .r1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .proj b{ font:700 15px 'Inter',sans-serif; }
  .proj .sub{ color:var(--mute); font-size:13px; margin-top:3px; line-height:1.35; }
  .proj small{ display:block; font:400 10.5px var(--mono); letter-spacing:.1em; color:var(--mute); margin-top:6px; text-transform:uppercase; }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .badge{ white-space:nowrap; font:600 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border:1px solid; }
  .b-rojo{ color:var(--danger); border-color:rgba(255,130,114,.5); background:rgba(255,130,114,.10); }
  .b-ambar{ color:var(--sand); border-color:rgba(242,204,143,.45); background:rgba(242,204,143,.08); }
  .b-gris{ color:var(--mute); border-color:rgba(142,150,178,.35); background:rgba(142,150,178,.07); }
  .b-ok{ color:#B5DEC9; border-color:rgba(129,178,154,.6); background:rgba(129,178,154,.14); }
  .vacio{ text-align:center; color:var(--mute); padding:44px 10px; font:400 12px var(--mono); letter-spacing:.12em; text-transform:uppercase; }

  /* ---------- paneles HUD ---------- */
  .bloque{ position:relative; background:var(--panel); border:1px solid var(--line); padding:18px 16px 16px; margin-bottom:14px; backdrop-filter:blur(6px); }
  .bloque::before, .bloque::after{ content:""; position:absolute; width:14px; height:14px; pointer-events:none; }
  .bloque::before{ top:-1px; left:-1px; border-top:2px solid var(--terra); border-left:2px solid var(--terra); }
  .bloque::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--sand); border-right:2px solid var(--sand); }
  .bloque h3{ display:flex; align-items:center; gap:10px; font:600 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--sand); margin:0 0 14px; }
  .bloque h3::before{ content:"//"; color:var(--terra); }
  .bloque h3::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent); }
  .ayuda{ margin:0 0 10px; color:var(--mute); font-size:12.5px; line-height:1.45; }
  .ayuda b{ color:var(--sand); }
  input[type=text], input[type=number], input[type=password], textarea{ width:100%; background:var(--panel2); border:1px solid rgba(242,204,143,.22); color:var(--ink); padding:12px; min-height:52px; font:500 18px 'Inter',sans-serif; border-radius:0; transition:border-color .2s, box-shadow .2s, background .2s; }
  textarea{ font-size:16px; min-height:84px; margin-top:8px; resize:vertical; }
  input::placeholder, textarea::placeholder{ color:rgba(142,150,178,.7); }
  input:focus, textarea:focus{ outline:none; border-color:var(--terra); box-shadow:0 0 0 3px rgba(var(--terra-rgb),.16), 0 0 18px rgba(var(--terra-rgb),.18); background:rgba(255,255,255,.06); }
  .paq-n{ margin:14px 0 6px; font:600 10.5px var(--mono); letter-spacing:.12em; color:var(--mute); text-transform:uppercase; display:flex; justify-content:space-between; align-items:center; }
  .paq-mas, .paq-quitar{ background:none; border:none; color:var(--terra); font:600 11px var(--mono); letter-spacing:.08em; cursor:pointer; padding:10px 0 0; min-height:36px; text-transform:uppercase; }
  .paq-quitar{ padding:0; min-height:0; color:var(--mute); }
  .grid4{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid4 label{ display:block; margin-bottom:5px; font:600 10.5px var(--mono); letter-spacing:.12em; color:var(--mute); text-transform:uppercase; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg button{ min-height:54px; border:1px solid rgba(242,204,143,.3); background:var(--panel2); color:var(--mute); font:600 12.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; cursor:pointer; clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .seg button[data-v=OK][aria-pressed=true]{ background:rgba(129,178,154,.18); border-color:rgba(129,178,154,.8); color:#B5DEC9; box-shadow:0 0 18px rgba(129,178,154,.25); }
  .seg button[data-v=FALLA][aria-pressed=true]{ background:rgba(255,130,114,.14); border-color:rgba(255,130,114,.7); color:var(--danger); box-shadow:0 0 18px rgba(255,130,114,.2); }
  .foto{ display:flex; align-items:center; gap:12px; }
  .foto img{ width:72px; height:72px; object-fit:cover; border:1px solid var(--line); }

  /* ---------- botones ---------- */
  .btn{ display:block; width:100%; border:1px solid rgba(242,204,143,.45); background:transparent; color:var(--sand); padding:15px 14px; min-height:52px; font:600 12.5px var(--mono); letter-spacing:.13em; text-transform:uppercase; cursor:pointer; transition:all .2s;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .btn:hover{ background:rgba(242,204,143,.1); box-shadow:0 0 18px rgba(242,204,143,.2); }
  .btn.go{ background:linear-gradient(135deg, var(--terra), var(--terra-d)); color:#fff; border-color:transparent; box-shadow:0 0 26px rgba(var(--terra-rgb),.35); }
  .btn.go:hover{ filter:brightness(1.1); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .back{ background:none; border:none; color:var(--terra); font:600 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; cursor:pointer; padding:12px 0; min-height:44px; }
  .ficha{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin:0 0 16px; }
  .ficha-name{ font:800 20px var(--disp); margin:0 0 4px; }
  .ficha-code{ font:600 11px var(--mono); letter-spacing:.16em; color:var(--sand); }
  .ficha p{ margin:6px 0 0; color:var(--mute); font-size:13px; line-height:1.4; }
  .guardado{ font:400 10.5px var(--mono); letter-spacing:.1em; color:var(--mute); text-align:right; min-height:16px; text-transform:uppercase; margin-bottom:6px; }
  .aviso{ padding:10px 12px; font-size:12.5px; margin:0 0 14px; line-height:1.45; border:1px solid; }
  .aviso.b-ok{ background:rgba(129,178,154,.10); border-color:rgba(129,178,154,.5); color:#B5DEC9; }
  .aviso.b-ambar{ background:rgba(242,204,143,.08); border-color:rgba(242,204,143,.4); color:var(--sand); }

  /* ---------- barra inferior ---------- */
  .dock{ position:fixed; left:0; right:0; bottom:0; z-index:30; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(7,10,20,.94) 38%); }
  .dock .in{ max-width:640px; margin:0 auto; }
  .dock .btn{ margin:0; padding:16px 14px; font-size:13.5px; }
  .dock .estado{ font:400 10.5px var(--mono); letter-spacing:.1em; color:var(--sage); text-align:center; margin-bottom:6px; text-transform:uppercase; }
  .dock .estado.falta{ color:var(--danger); }

  /* ---------- candado ---------- */
  .lock{ position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; background:radial-gradient(700px 500px at 50% 30%, #1B2547, var(--bg) 70%); }
  .lock .core-logo{ width:78px; height:78px; }
  .lock h2{ font:800 18px var(--disp); letter-spacing:.14em; margin:0; }
  .lock p{ font:400 12px var(--mono); letter-spacing:.08em; color:var(--mute); margin:10px 0 0; max-width:34ch; line-height:1.6; }
  .lock-form{ display:flex; gap:8px; width:100%; max-width:320px; } .lock-form input{ flex:1; text-align:center; letter-spacing:.3em; }
  .lock-form .btn{ width:auto; margin:0; padding:0 18px; }
  .lock-err{ font:400 12px var(--mono); color:var(--danger); min-height:16px; }

  select{ width:100%; background:var(--panel2); border:1px solid rgba(242,204,143,.22); color:var(--ink); padding:12px; min-height:52px; font:500 16px 'Inter',sans-serif; border-radius:0; }
  select:focus{ outline:none; border-color:var(--terra); box-shadow:0 0 0 3px rgba(var(--terra-rgb),.16); }
  select option{ background:#10172C; color:var(--ink); }
  .aviso .link{ display:block; padding:10px 0 0; min-height:0; }
  .nec{ font:400 10px var(--mono); letter-spacing:.08em; color:var(--mute); text-transform:none; margin-left:6px; }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .gap{ height:12px; }
  input[type=date]{ width:100%; background:var(--panel2); border:1px solid rgba(242,204,143,.22); color:var(--ink); padding:12px; min-height:52px; font:500 16px 'Inter',sans-serif; border-radius:0; color-scheme:dark; }
  input[type=date]:focus{ outline:none; border-color:var(--terra); }
  .frase{ margin:2px 0 6px; font-size:13px; line-height:1.45; color:var(--sand); }
  .frase.suya{ font-style:italic; }
  .cumple{ margin:10px 0 0; padding:12px; border:1px solid rgba(242,204,143,.5); background:rgba(242,204,143,.10); color:var(--sand); font-size:14px; line-height:1.45; }
  .sw{ width:46px; height:46px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .sw[aria-pressed=true]{ border-color:var(--ink); box-shadow:0 0 0 3px rgba(236,232,214,.18); }
  .emo{ min-width:46px; min-height:46px; font-size:22px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; color:var(--mute); font-family:inherit; }
  .emo[aria-pressed=true]{ border-color:var(--sand); background:rgba(242,204,143,.12); color:var(--ink); }
  img.render{ display:block; width:100%; max-height:60vh; object-fit:contain; background:#000; border:1px solid var(--line); cursor:zoom-in; }
  .visor{ position:fixed; inset:0; z-index:100; background:#000; overflow:auto; touch-action:pan-x pan-y pinch-zoom; }
  .visor img{ display:block; width:100%; min-height:100%; object-fit:contain; }
  .visor button{ position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:101; min-height:44px; padding:0 16px; background:rgba(7,10,20,.85); border:1px solid var(--sand); color:var(--sand); font:600 12px var(--mono); letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .nota-pie{ font-size:11.5px; color:var(--mute); line-height:1.5; margin:4px 2px 0; }
  .bienv{ position:relative; margin:0 0 14px; padding:14px 14px 6px; border:1px solid rgba(129,178,154,.55); background:rgba(129,178,154,.10); color:#CFE8DB; font-size:13.5px; line-height:1.55; }
  .bienv b{ display:block; font:800 15px var(--disp); margin-bottom:6px; color:var(--ink); }
  .bienv .link{ display:block; margin-left:auto; padding:10px 0; min-height:44px; }
  .toast{ position:fixed; left:50%; bottom:calc(120px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:calc(100% - 32px); max-width:608px; background:#10172C; border:1px solid var(--line-hi); color:var(--ink); padding:12px 16px; font:500 13px 'Inter',sans-serif; z-index:95; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  .toast.err{ border-color:rgba(255,130,114,.7); color:#FFB4A9; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gCore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF6DC"/><stop offset=".45" stop-color="#F2CC8F"/><stop offset="1" stop-color="#E07A5F" stop-opacity=".15"/></radialGradient>
    <symbol id="reactor" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" fill="none" stroke="#F2CC8F" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 5"/>
      <g class="rot" style="transform-origin:32px 32px;animation:gira 22s linear infinite"><path d="M32 6 A26 26 0 0 1 58 32" fill="none" stroke="#E07A5F" stroke-width="2.4" stroke-linecap="round"/><path d="M32 58 A26 26 0 0 1 6 32" fill="none" stroke="#E07A5F" stroke-width="2.4" stroke-linecap="round"/></g>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#F2CC8F" stroke-width="1.4" stroke-opacity=".8"/>
      <g stroke="#F2CC8F" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"><path d="M32 17v6M32 41v6M17 32h6M41 32h6"/></g>
      <circle cx="32" cy="32" r="9" fill="url(#gCore)"/>
    </symbol>
  </defs>
</svg>
<div class="wrap" id="app"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw2wvTODLwGZ07v7XcyWJ9Eyf5L8xZMwiFjed0qN3iAXWGVJ27KWb48ju5oWsGyXJwXbA/exec'; // Apps Script → Implementar → URL de la aplicación web

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} },
  del(k){ try { localStorage.removeItem(k); } catch(_) {} }
};
/* ───────── Mi espacio (preferencias de Daniela; se guardan solo en este dispositivo) ───────── */
const PREF_DEF = { nombre: 'Daniela', emoji: '', color: 'terra', frase: '', inicio: 'producir', orden: 'fecha', cumple: '', sobrio: false };
const COLORES = { terra: ['#E07A5F', '#C4603F', '224,122,95', 'Terracota'], sage: ['#81B29A', '#5E9A7E', '129,178,154', 'Salvia'], sand: ['#F2CC8F', '#D9B06A', '242,204,143', 'Arena'],
  rosa: ['#E58FA8', '#C96D8B', '229,143,168', 'Rosa'], lila: ['#A99BE0', '#8677C9', '169,155,224', 'Lila'], cielo: ['#6FB3E0', '#4C93C4', '111,179,224', 'Cielo'] };
const EMOJIS = ['', '🌸', '☕', '🌿', '✨', '🎧', '🦋', '🌙', '🐱', '🍓'];
function leerPref(){ try { const o = JSON.parse(store.get('jp_pref') || '{}'); return Object.assign({}, PREF_DEF, o && typeof o === 'object' ? o : {}); } catch (_) { return Object.assign({}, PREF_DEF); } }
let P = leerPref();
function aplicarPref(){ const c = COLORES[P.color] || COLORES.terra, r = document.documentElement.style; r.setProperty('--terra', c[0]); r.setProperty('--terra-d', c[1]); r.setProperty('--terra-rgb', c[2]); }
function guardarPref(){ store.set('jp_pref', JSON.stringify(P)); aplicarPref(); }
const nom = () => (String(P.nombre || '').trim() || 'Daniela');
aplicarPref();

const RENDERS = {};
const S = { pin: store.get('jp_pin') || '', items: [], tab: 'producir', filtro: 'semana', cargando: false, online: null, laminas: null, conteo: {}, aviso: { tipo: '', folio: '', nota: '' }, abierto: null, form: {}, preview: {}, errPin: '' };
let saveTimer = null;
const REACTOR = '<svg class="core-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#reactor"/></svg>';

/* ───────── API ───────── */
async function api(accion, extra){
  if (API_URL.indexOf('PEGAR_AQUI') === 0) throw new Error('Falta configurar API_URL en el archivo');
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight de CORS con Apps Script
    body: JSON.stringify(Object.assign({ modulo: 'produccion', pin: S.pin, accion }, extra || {}))
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error desconocido');
  return j;
}
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function saludoHora(){ const h = new Date().getHours(); return h < 12 ? 'Buenos días' : (h < 19 ? 'Buenas tardes' : 'Buenas noches'); }
function esCumple(){
  if (!P.cumple || P.cumple.length < 10) return false;
  const d = new Date(), mm = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return P.cumple.slice(5) === mm + '-' + dd;
}
function celebra(tipo, negocio){
  const x = negocio || 'el pedido', n = nom();
  const a = tipo === 'completar'
    ? ['Qué buen trabajo con ' + x + ', ' + n + '.', 'Así se hace, ' + n + ': ' + x + ' quedó listo.', x + ' terminado. Se nota el cuidado, ' + n + '.']
    : [x + ' ya va en camino. Gracias, ' + n + '.', 'Entregado. Un pendiente menos, ' + n + '.', 'Listo, ' + n + '. ' + x + ' salió a tiempo.'];
  return pick(a);
}
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4500 : 3200);
}
async function cargar(){
  S.cargando = true; render();
  try {
    const j = await api('lista');
    S.items = j.items; S.laminas = j.laminas || null; S.online = true; S.errPin = '';
  } catch (e) {
    if (/PIN incorrecto/.test(e.message)) { store.del('jp_pin'); S.pin = ''; S.errPin = 'Ese PIN no coincide. Revísalo con calma e inténtalo otra vez.'; }
    else if (/PIN/.test(e.message)) { store.del('jp_pin'); S.pin = ''; S.errPin = e.message; }
    else { S.online = false; toast(e.message, true); }
  }
  S.cargando = false; render();
}

/* ───────── Render ───────── */
function render(){
  const app = $('#app');
  if (!S.pin) return vistaLogin(app);
  if (S.abierto) return vistaDetalle(app);
  vistaLista(app);
}

function vistaLogin(app){
  app.innerHTML = `<div class="lock">${REACTOR}
    <div><h2>JOART PRODUCCIÓN</h2><p>${S.despedida ? esc(S.despedida) : 'Hola, ' + esc(nom()) + '. Escribe tu PIN para entrar.'}</p></div>

}

function badge(it){
  if (it.dias === null) return ['Sin fecha', 'gris'];
  if (it.dias < 0) return ['Vencido ' + (-it.dias) + ' d', 'rojo'];
  if (it.dias === 0) return ['Hoy', 'ambar'];
  if (it.dias === 1) return ['Mañana', 'ambar'];
  return [it.fechaTxt, 'gris'];
}

function onlineHtml(){
  if (S.online === false) return '<div class="online off"><i></i>SIN CONEXIÓN</div>';
  return '<div class="online"><i></i>' + (S.cargando ? 'SINCRONIZANDO' : 'EN LÍNEA') + '</div>';
}

function conteoPendiente(){
  const L = S.laminas; if (!L) return '';
  if (L.dias === null) return 'Todavía no hay un conteo de láminas registrado';
  if (new Date().getDay() === 5 && L.dias !== 0) return 'Hoy es viernes: toca el conteo de láminas';
  if (L.dias >= 8) return 'Hace ' + L.dias + ' días que no se cuentan las láminas';
  return '';
}

function ordenar(a){

  return c;
}

/* ───────── Detalle ───────── */
function faltantes(it, f){
  const m = [];
  if (f.contadas === '' || f.contadas == null) m.push('conteo');
  else if (Number(f.contadas) !== it.esperado && !String(f.notaConteo || '').trim()) m.push('nota del conteo');
  if (f.impresion !== 'OK') m.push('impresión OK');
  if (f.corte !== 'OK') m.push('corte OK');
  if (it.nuevo && f.armado !== 'OK') m.push('armado OK');
  if (!f.fotoFinal) m.push('foto final');
  if (['alto','ancho','largo'].some(k => !(Number(f[k]) > 0))) m.push('medidas del paquete' + ((f.extras || []).length ? ' 1' : ''));
  (f.extras || []).forEach((e, i) => { if (['alto','ancho','largo'].some(k => !(Number(e[k]) > 0))) m.push('medidas del paquete ' + (i + 2)); });
  return m;
}
function seg(k, f){
  return `<div class="seg" data-k="${k}">

}

    ${n < 4 ? `<button class="btn" data-act="foto" data-tipo="final">📷 ${n ? 'Agregar otra foto' : 'Tomar foto'}</button>

function bloqueProblema(){

function actualizarGate(){
  const it = S.items.find(i => i.folio === S.abierto); if (!it) return;
  const f = S.form;
  let m, txt;
  if (it.etapa === 'producir') {
    const hay = f.contadas !== '' && f.contadas != null && Number(f.contadas) !== it.esperado;

  const el = $('#faltan'); el.textContent = txt; el.className = 'estado' + (m.length ? ' falta' : '');

/* ───────── Fotos ───────── */
function cargarScript(src){
  return new Promise((res, rej) => { const t = document.createElement('script'); t.src = src; t.onload = res; t.onerror = () => rej(new Error('sin conexión')); document.head.appendChild(t); });
}
// Decodifica la foto ya reducida (más ligero para el teléfono) y respeta la orientación
async function decodificar(blob){
  if (window.createImageBitmap) {
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (_) { /* se intenta de otra forma */ }
  }
  return await new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    img.src = u;
  });
}
function esHeic(file){ return /hei[cf]/i.test(file.type || '') || /\.hei[cf]$/i.test(file.name || ''); }
async function comprimir(file){
  let origen = file, img;
  try { img = await decodificar(origen); }
  catch (_) {
    if (esHeic(file)) {   // fotos de iPhone en formato HEIC: se convierten aquí mismo
      try {
        if (!window.heic2any) await cargarScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
        const out = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.8 });
        origen = Array.isArray(out) ? out[0] : out;
        img = await decodificar(origen);
      } catch (_2) { throw new Error('Esa foto está en formato HEIC y no se pudo convertir. Tómala directo con el botón "Tomar foto" o, en el iPhone, Ajustes → Cámara → Formatos → "Más compatible".'); }
    } else {
      throw new Error('No pude leer esa imagen (' + (file.type || (file.name || '').split('.').pop() || 'formato desconocido') + '). Prueba con "Tomar foto" o con otra imagen JPG o PNG.');
    }
  }
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
  const k = Math.min(1, 1280 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const cx = c.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);   // PNG con transparencia
  cx.drawImage(img, 0, 0, c.width, c.height);
  if (img.close) img.close();
  const url = c.toDataURL('image/jpeg', 0.72);
  if (url.length < 1000) throw new Error('No pude procesar la foto. Prueba con otra.');
  return { b64: url.split(',')[1], preview: url };
}
async function subirFoto(tipo, file){
  const est = $('#fotoEstado-' + tipo);
  try {
    if (est) est.textContent = 'Subiendo…';
    const { b64, preview } = await comprimir(file);
    await api('foto', { folio: S.abierto, tipo, b64 });
    S.preview.finalList = (S.preview.finalList || []).concat(preview);
    S.form.nFinal = (Number(S.form.nFinal) || 0) + 1;
    S.form.fotoFinal = true;
    vistaDetalle($('#app'));
    toast('Foto guardada ✓');
  } catch (e) {
    if (est) est.textContent = 'Falló la subida';
    toast(e.message, true);
  }
}

/* ───────── Eventos ───────── */
function abrir(folio){
  const it = S.items.find(i => i.folio === folio); if (!it) return;
  S.abierto = folio; S.preview = {};
  const d = it.datos || {};
  S.form = Object.assign({ contadas:'', notaConteo:'', impresion:'', corte:'', armado:'', alto:'', ancho:'', largo:'', fotoFinal:false }, d);
  Object.keys(S.form).forEach(k => { if (S.form[k] == null) S.form[k] = ''; });
  S.form.extras = (d.extras || []).map(e => Object.assign({}, e));
  window.scrollTo(0, 0); render();
}
async function cerrarDetalle(){
  if (saveTimer) await guardarYa();
  S.abierto = null; render(); cargar();
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'entrar') {
    const v = ($('#pin').value || '').trim(); if (!v) return;
    S.pin = v; S.despedida = ''; store.set('jp_pin', v); cargar();
  } else if (a === 'salir') { store.del('jp_pin'); S.pin = ''; S.items = []; S.online = null; S.despedida = P.sobrio ? '' : 'Descansa, ' + nom() + '. Aquí estaremos cuando vuelvas.'; render(); }
  else if (a === 'recargar') cargar();
  else if (a === 'tab') { S.tab = b.dataset.v; render(); window.scrollTo(0, 0); }
  else if (a === 'cargarRender') {
    b.disabled = true; b.textContent = 'Cargando…';
    try { const j = await api('render', { folio: b.dataset.folio }); RENDERS[b.dataset.folio] = 'data:' + j.mime + ';base64,' + j.b64; if (S.abierto === b.dataset.folio) vistaDetalle($('#app')); }
    catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Ver render aprobado'; }
  }
  else if (a === 'verRender') {
    const v = document.createElement('div'); v.className = 'visor';
    v.innerHTML = '<button data-act="cerrarVisor">Cerrar</button><img alt="Render aprobado">'; v.querySelector('img').src = RENDERS[b.dataset.folio]; document.body.appendChild(v);
  }
  else if (a === 'cerrarVisor') { const v = b.closest('.visor'); if (v) v.remove(); }
  else if (a === 'cerrarBienv') { store.set('jp_visto', '1'); render(); }
  else if (a === 'pfColor') { P.color = b.dataset.v; guardarPref(); render(); }
  else if (a === 'pfEmoji') { P.emoji = b.dataset.v; guardarPref(); render(); }
  else if (a === 'pfInicio') { P.inicio = b.dataset.v; guardarPref(); render(); toast(P.sobrio ? 'Guardado' : 'Anotado, ' + nom() + '. Así te va a aparecer.'); }
  else if (a === 'pfOrden') { P.orden = b.dataset.v; guardarPref(); render(); }
  else if (a === 'pfSobrio') { P.sobrio = b.dataset.v === '1'; guardarPref(); render(); }
  else if (a === 'pfReset') { P = Object.assign({}, PREF_DEF); guardarPref(); render(); toast('Listo, todo como al inicio'); }
  else if (a === 'filtro') { S.filtro = b.dataset.v; render(); }
  else if (a === 'abrir') abrir(b.dataset.folio);
  else if (a === 'volver') cerrarDetalle();
  else if (a === 'seg') {
    const k = b.dataset.k; S.form[k] = b.dataset.v;
    document.querySelectorAll('.seg[data-k="' + k + '"] button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === S.form[k]));
    actualizarGate(); programarGuardado();
  }
  else if (a === 'agregarPaquete') {
    if ((S.form.extras || []).length < 4) {
      S.form.extras.push({ alto: '', ancho: '', largo: '', foto: false });
      vistaDetalle($('#app')); actualizarGate(); programarGuardado();
      const i = $('#ex-' + (S.form.extras.length - 1) + '-alto'); if (i) i.focus();
    }
  }
  else if (a === 'quitarPaquete') { S.form.extras.pop(); vistaDetalle($('#app')); actualizarGate(); programarGuardado(); }
  else if (a === 'quitarFoto') {
    try { await api('foto_quitar', { folio: S.abierto }); S.form.nFinal = Math.max(0, (Number(S.form.nFinal) || 1) - 1); S.form.fotoFinal = S.form.nFinal > 0;
      if (S.preview.finalList) S.preview.finalList.pop(); vistaDetalle($('#app')); actualizarGate(); toast('Foto quitada'); }
    catch (e) { toast(e.message, true); }
  }
  else if (a === 'galeria') { const i = $('#file-' + b.dataset.tipo + '-g'); if (i) i.click(); }
  else if (a === 'foto') { const i = $('#file-' + b.dataset.tipo); if (i) i.click(); }
  else if (a === 'problema') { $('#probWrap').hidden = !$('#probWrap').hidden; }
  else if (a === 'enviarProblema') {
    const t = ($('#probTxt').value || '').trim(); if (!t) return toast('Describe el problema', true);
    try { await api('incidencia', { folio: S.abierto, texto: t }); toast('Aviso enviado a Jorge ✓'); $('#probTxt').value = ''; $('#probWrap').hidden = true; }
    catch (e) { toast(e.message, true); }
  }
  else if (a === 'avTipo') {
    S.aviso.tipo = b.dataset.v;
    document.querySelectorAll('[data-act=avTipo]').forEach(x => x.classList.toggle('on', x.dataset.v === S.aviso.tipo));
  }
  else if (a === 'enviarAviso') {
    if (!S.aviso.tipo) return toast('Elige qué quieres avisar', true);
    if (S.aviso.tipo === 'otro' && !S.aviso.nota.trim()) return toast('Escribe el aviso', true);
    b.disabled = true;
    try {
      const j = await api('aviso', { tipo: S.aviso.tipo, folio: S.aviso.folio, nota: S.aviso.nota });
      toast(j.repetido ? 'Ya le avisaste hace poco' : 'Aviso enviado a Jorge ✓');
      S.aviso = { tipo: '', folio: '', nota: '' }; render();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  }
  else if (a === 'avisoRapido') {
    b.disabled = true;
    try {
      const j = await api('aviso', { tipo: b.dataset.tipo, folio: b.dataset.folio });
      toast(j.repetido ? 'Ya le avisaste hace poco' : 'Aviso enviado a Jorge ✓');
    } catch (e) { toast(e.message, true); }
    b.disabled = false;
  }
  else if (a === 'guardarConteo') {
    const L = S.laminas; if (!L) return;
    const sin = L.cols.filter(c => S.conteo[c.i] === undefined || String(S.conteo[c.i]).trim() === '');
    if (sin.length) return toast('Falta contar: ' + sin.map(c => c.grosor).join(', '), true);
    b.disabled = true;
    try {
      const j = await api('laminas_guardar', { valores: S.conteo });
      S.laminas = j.laminas; S.conteo = {};
      toast((P.sobrio ? '' : 'Gracias por contar, ' + nom() + '. ') + (j.faltan && j.faltan.length ? 'Conteo guardado ✓ Jorge ya sabe que faltan láminas' : 'Conteo guardado ✓ Jorge ya recibió el aviso'));
      render();
    } catch (e) { toast(e.message, true); b.disabled = false; }
  }
  else if (a === 'completar') {
    b.disabled = true;
    try {
      await guardarYa();
      const itx = S.items.find(i => i.folio === S.abierto);
      await api(a, { folio: S.abierto });
      toast(P.sobrio ? 'Producción completa ✓ Jorge ya recibió el aviso'
        : celebra(a, itx && itx.negocio) + (a === 'completar' ? ' Jorge ya recibió el aviso ✓' : ' ✓'));
      S.abierto = null; cargar();
    } catch (e) { toast(e.message, true); actualizarGate(); }
  }
});

document.addEventListener('input', ev => {
  const mm = /^lam-(\d+)$/.exec(ev.target.id || '');
  if (mm) { S.conteo[mm[1]] = ev.target.value; return; }
  if (ev.target.id === 'avNota') { S.aviso.nota = ev.target.value; return; }
  if (ev.target.id === 'pf-nombre') { P.nombre = ev.target.value; guardarPref(); return; }
  if (ev.target.id === 'pf-frase') { P.frase = ev.target.value; guardarPref(); return; }
  const id = ev.target.id; if (!S.abierto || !id) return;
  const mx = /^ex-(\d)-(alto|ancho|largo)$/.exec(id);
  if (mx && S.form.extras[+mx[1]]) { S.form.extras[+mx[1]][mx[2]] = ev.target.value; actualizarGate(); programarGuardado(); return; }
  if (['contadas','notaConteo','alto','ancho','largo'].indexOf(id) >= 0) {
    S.form[id] = ev.target.value; actualizarGate(); programarGuardado();
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'avFolio') { S.aviso.folio = ev.target.value; return; }
  if (ev.target.id === 'pf-cumple') { P.cumple = ev.target.value; guardarPref(); render(); return; }
  const m = /^file-final(-g)?$/.exec(ev.target.id || '');
  if (m && ev.target.files && ev.target.files[0]) {
    let fls = Array.from(ev.target.files); ev.target.value = '';
    const libres = 4 - (Number(S.form.nFinal) || 0);
    if (fls.length > libres) { toast('Solo caben ' + libres + ' foto' + (libres === 1 ? '' : 's') + ' más; subo las primeras ' + libres, true); fls = fls.slice(0, libres); }
    (async () => { for (const fl of fls) await subirFoto('final', fl); })();
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'pin') document.querySelector('[data-act=entrar]').click(); });

render();
if (S.pin) cargar();
</script>
