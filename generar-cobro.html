<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joart Digital — Generar cobro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream:#F4F1DE; --terracota:#E07A5F; --terracota-dark:#C4603F;
    --navy:#3D405B; --sage:#81B29A; --sand:#F2CC8F;
    --card:#FFFFFF; --line:#E3DFCB; --muted:#6E6C63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--navy);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; min-height:100vh;
  }
  h1{ font-family:'Archivo Expanded',sans-serif; font-weight:800; margin:0; }

  .wrap{ width:100%; max-width:560px; padding:24px 20px 60px; }
  .top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .top-mark{
    width:32px;height:32px; background:var(--navy); color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Expanded',sans-serif; font-weight:800; font-size:14px;
  }
  .top-title{ font-size:15px; font-weight:700; }
  .top-tag{ font-size:11.5px; color:var(--muted); }

  h1.page-title{ font-size:22px; margin:18px 0 4px; }
  .page-sub{ font-size:13px; color:var(--muted); margin:0 0 24px; }

  .card{ background:var(--card); border:1px solid var(--line); padding:20px; margin-bottom:16px; }
  .card-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:12px; }

  .search-row{ display:flex; gap:8px; }
  .search-row input{
    flex:1; border:1px solid var(--line); background:var(--cream); color:var(--navy);
    padding:11px 12px; font-family:'Inter',sans-serif; font-size:15px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase;
  }
  .search-row input:focus{ outline:none; border-color:var(--terracota); }
  .search-btn{
    background:var(--navy); color:var(--cream); border:none; padding:0 18px;
    font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .search-btn:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }
  .search-error{ font-size:12.5px; color:var(--terracota-dark); margin-top:8px; min-height:16px; }

  .pedido-info{ display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .pedido-info.show{ display:block; }
  .pedido-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; }
  .pedido-row span:first-child{ color:var(--muted); }
  .pedido-row span:last-child{ font-weight:600; text-align:right; max-width:60%; }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:12px; font-weight:600; color:var(--muted); }
  .field input, .field select{
    border:1px solid var(--line); background:var(--cream); color:var(--navy);
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--terracota); }
  .field-hint{ font-size:11.5px; color:var(--muted); }

  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .save-btn{
    width:100%; background:var(--terracota); color:white; border:none;
    padding:14px; font-size:14.5px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif; margin-top:8px;
  }
  .save-btn:hover{ background:var(--terracota-dark); }
  .save-btn:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }

  .cobro-box{ display:none; margin-top:18px; padding:18px; background:var(--navy); color:var(--cream); }
  .cobro-box.show{ display:block; }
  .cobro-total{ font-family:'Archivo Expanded',sans-serif; font-size:22px; font-weight:800; color:var(--sand); margin-bottom:2px; }
  .cobro-sub{ font-size:12px; color:rgba(244,241,222,.65); margin-bottom:14px; }
  .cobro-split{ display:flex; gap:10px; margin-bottom:14px; }
  .cobro-split-item{ flex:1; background:rgba(244,241,222,.08); padding:10px 12px; }
  .cobro-split-item span{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:rgba(244,241,222,.55); margin-bottom:3px; }
  .cobro-split-item strong{ font-family:'Archivo Expanded',sans-serif; font-size:16px; font-weight:800; }
  .copy-btn{
    width:100%; background:var(--sage); color:#1B3B30; border:none; padding:12px;
    font-size:13.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; margin-bottom:8px;
  }
  .copy-btn:hover{ background:#6FA089; }
  .copy-btn.copied{ background:var(--sand); }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="top-mark">J</div>
    <div>
      <div class="top-title">Joart Digital</div>
      <div class="top-tag">Generar cobro — uso interno</div>
    </div>
  </div>

  <h1 class="page-title">Generar cobro de un pedido</h1>
  <p class="page-sub">Busca el pedido por su código de seguimiento — no crea nada nuevo, solo agrega el precio y genera el mensaje de cobro sobre el pedido que ya existe.</p>

  <div class="card">
    <div class="card-label">Buscar pedido</div>
    <div class="search-row">
      <input type="text" id="codigoInput" placeholder="JD-XXXXX">
      <button type="button" class="search-btn" id="buscarBtn">Buscar</button>
    </div>
    <div class="search-error" id="searchError"></div>

    <div class="pedido-info" id="pedidoInfo">
      <div class="pedido-row"><span>Cliente</span><span id="infoCliente">—</span></div>
      <div class="pedido-row"><span>Modelo</span><span id="infoModelo">—</span></div>
      <div class="pedido-row"><span>Cantidad</span><span id="infoCantidad">—</span></div>
      <div class="pedido-row"><span>Grosor</span><span id="infoGrosor">—</span></div>
    </div>
  </div>

  <div class="card" id="cobroCard" style="display:none;">
    <div class="card-label">Cobro</div>
    <div class="row">
      <div class="field">
        <label for="fFactura">¿Requiere factura?</label>
        <select id="fFactura">
          <option value="no">No — cuenta personal</option>
          <option value="si">Sí — cuenta fiscal</option>
        </select>
      </div>
      <div class="field">
        <label for="fPrecioUnitario">Precio unitario (MXN)</label>
        <input type="number" id="fPrecioUnitario">
      </div>
    </div>
    <div class="field-hint" id="precioHint"></div>

    <button type="button" class="save-btn" id="saveBtn">Guardar cobro y generar mensajes</button>
  </div>

  <div class="cobro-box" id="cobroBox"></div>
</div>

<script>
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw2wvTODLwGZ07v7XcyWJ9Eyf5L8xZMwiFjed0qN3iAXWGVJ27KWb48ju5oWsGyXJwXbA/exec";

  // ============ DATOS BANCARIOS — llénalos tú mismo aquí ============
  const DATOS_BANCARIOS = {
    personal: {
      titular: "Jorge Arturo Mendoza Gama",
      banco: "BBVA",
      clabe: "012 180 01560003155 0",
    },
    fiscal: {
      titular: "LUZ MARIA ESPINOSA AVIÑA",
      banco: "BBVA",
      clabe: "012 180 00491220977 7",
    },
  };

  // Misma tabla de precios que en captura-rapida.html.
  const QUIEBRES = [1, 3, 5, 10, 15, 20, 25, 30, 50, 75, 100];
  const TABLA_POR_MODELO = {
    "Counter display compacto con organizador": "counter",
    "Display con separadores": "separadores",
    "Pegboard display con ganchos": "pegboard",
    "Display escalonado — 2 escalones": "escalonado2",
    "Display escalonado — 3 escalones": "escalonado3",
    "Display box — 1 nivel": "displaybox",
    "POP display — 2 niveles": "pop2",
    "POP display chico — 2 niveles": "pop2",
    "POP display — 3 niveles": "pop3repisas",
    "Display con repisas": "pop3repisas",
    "Floor stand — 3 niveles": "floor3",
    "Floor stand — 4 niveles": "floor4",
    "Floor stand — 5 niveles": "floor5",
    "Floor stand chico — 3 niveles": "floor3",
    "Floor stand con ganchos": "floor3",
  };
  const PRECIOS = {
    counter: { "4 mm": [250,215,180,160,150,145,140,130,120,110,100] },
    displaybox: {
      "4 mm": [500,450,420,380,350,330,310,300,280,260,250],
      "5 mm": [650,600,570,530,500,480,460,450,430,410,400],
      "6 mm": [900,850,820,780,750,730,710,700,680,660,650],
    },
    pop2: {
      "4 mm": [800,720,680,610,560,530,500,480,450,420,400],
      "5 mm": [950,870,830,760,710,680,650,630,600,570,550],
      "6 mm": [1200,1120,1080,1010,960,930,900,880,850,820,800],
    },
    pop3repisas: {
      "4 mm": [1050,975,930,870,830,800,760,730,715,690,670],
      "5 mm": [1200,1125,1080,1020,980,950,910,880,865,840,820],
      "6 mm": [1450,1375,1330,1270,1230,1200,1160,1130,1115,1090,1070],
    },
    floor3: {
      "4 mm": [1300,1200,1150,1050,1000,950,920,890,850,825,800],
      "5 mm": [1450,1350,1300,1200,1150,1100,1070,1040,1000,975,950],
      "6 mm": [1700,1600,1550,1450,1400,1350,1320,1290,1250,1225,1200],
    },
    floor4: {
      "4 mm": [1700,1580,1500,1400,1350,1285,1230,1200,1150,1110,1070],
      "5 mm": [1850,1730,1650,1550,1500,1435,1380,1350,1300,1260,1220],
      "6 mm": [2100,1980,1900,1800,1750,1685,1630,1600,1550,1510,1470],
    },
    floor5: {
      "4 mm": [2600,2500,2400,2300,2200,2100,2000,1900,1800,1700,1600],
      "5 mm": [2750,2650,2550,2450,2350,2250,2150,2050,1950,1850,1750],
      "6 mm": [3000,2900,2800,2700,2600,2500,2400,2300,2200,2100,2000],
    },
    separadores: { "4 mm": [250,240,228,220,205,195,185,170,160,150,140] },
    pegboard: {
      "4 mm": [400,380,360,340,320,300,280,260,240,220,200],
      "5 mm": [550,530,510,490,470,450,430,410,390,370,350],
      "6 mm": [800,780,760,740,720,700,680,660,640,620,600],
    },
    escalonado2: {
      "4 mm": [665,630,595,560,525,490,455,420,385,350,315],
      "5 mm": [815,780,745,710,675,640,605,570,535,500,465],
      "6 mm": [1065,1030,995,960,925,890,855,820,785,750,715],
    },
    escalonado3: {
      "4 mm": [570,545,515,485,455,430,400,370,345,315,285],
      "5 mm": [720,695,665,635,605,580,550,520,495,465,435],
      "6 mm": [970,945,915,885,855,830,800,770,745,715,685],
    },
  };

  function precioUnitario(tablaKey, grosor, cantidad){
    const tabla = PRECIOS[tablaKey];
    if(!tabla) return null;
    const precios = tabla[grosor] || tabla["4 mm"];
    if(!precios) return null;
    let idx = 0;
    for(let i = 0; i < QUIEBRES.length; i++){
      if(cantidad >= QUIEBRES[i]) idx = i;
    }
    return precios[idx];
  }

  let pedidoActual = null;

  async function buscarPedido(){
    const codigo = document.getElementById("codigoInput").value.trim().toUpperCase();
    const errorEl = document.getElementById("searchError");
    const btn = document.getElementById("buscarBtn");
    errorEl.textContent = "";
    document.getElementById("pedidoInfo").classList.remove("show");
    document.getElementById("cobroCard").style.display = "none";
    document.getElementById("cobroBox").classList.remove("show");

    if(!codigo){
      errorEl.textContent = "Escribe un código de seguimiento.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Buscando...";

    try{
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "buscarPedido", codigo }),
      });
      const result = await response.json();

      if(!result.ok){
        errorEl.textContent = result.error || "No se encontró el pedido.";
        return;
      }

      pedidoActual = { codigo, ...result };

      document.getElementById("infoCliente").textContent = result.cliente;
      document.getElementById("infoModelo").textContent = result.modelo;
      document.getElementById("infoCantidad").textContent = result.cantidad;
      document.getElementById("infoGrosor").textContent = result.grosor;
      document.getElementById("pedidoInfo").classList.add("show");
      document.getElementById("cobroCard").style.display = "block";

      // Sugerir precio automáticamente si el modelo está en la tabla.
      const tablaKey = TABLA_POR_MODELO[result.modelo];
      const hint = document.getElementById("precioHint");
      const precioInput = document.getElementById("fPrecioUnitario");

      if(result.precioActual){
        precioInput.value = (parseFloat(result.precioActual) / result.cantidad).toFixed(0);
        hint.textContent = "Ya tenía un precio guardado — puedes ajustarlo si cambió.";
      }else if(tablaKey){
        const sugerido = precioUnitario(tablaKey, result.grosor, result.cantidad);
        if(sugerido){
          precioInput.value = sugerido;
          hint.textContent = `Precio de tabla para ${result.cantidad} pza(s) a ${result.grosor}: $${sugerido} c/u.`;
        }
      }else{
        hint.textContent = "Modelo personalizado — escribe el precio que ya calculaste.";
      }

      if(result.facturaActual){
        document.getElementById("fFactura").value = result.facturaActual === "Sí" ? "si" : "no";
      }
    }catch(e){
      console.error(e);
      errorEl.textContent = "No se pudo conectar. Intenta de nuevo.";
    }finally{
      btn.disabled = false;
      btn.textContent = "Buscar";
    }
  }

  document.getElementById("buscarBtn").addEventListener("click", buscarPedido);
  document.getElementById("codigoInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter") buscarPedido();
  });

  document.getElementById("saveBtn").addEventListener("click", async () => {
    if(!pedidoActual) return;
    const precioUnit = parseFloat(document.getElementById("fPrecioUnitario").value) || 0;
    const requiereFactura = document.getElementById("fFactura").value === "si";

    const btn = document.getElementById("saveBtn");
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Guardando...";

    try{
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          accion: "guardarCobro",
          codigo: pedidoActual.codigo,
          precioUnitario: precioUnit,
          requiereFactura,
        }),
      });
      const result = await response.json();

      if(result.ok){
        mostrarBloqueCobro(precioUnit, requiereFactura);
      }else{
        alert("No se pudo guardar: " + (result.error || "error desconocido"));
      }
    }catch(e){
      console.error(e);
      alert("No se pudo conectar. Intenta de nuevo.");
    }finally{
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  function mostrarBloqueCobro(precioUnit, requiereFactura){
    const cantidad = pedidoActual.cantidad;
    const total = precioUnit * cantidad;
    const anticipo = Math.round(total * 0.5);
    const saldo = total - anticipo;
    const datos = requiereFactura ? DATOS_BANCARIOS.fiscal : DATOS_BANCARIOS.personal;
    const envioGratis = total > 1000;

    const box = document.getElementById("cobroBox");
    box.classList.add("show");

    box.innerHTML = `
      <div class="cobro-total">$${total.toLocaleString('es-MX')} MXN</div>
      <div class="cobro-sub">${cantidad} pza(s) × $${precioUnit.toLocaleString('es-MX')} ${envioGratis ? '· Envío gratis' : '· Envío no incluido (menor a $1,000)'}</div>
      <div class="cobro-split">
        <div class="cobro-split-item"><span>Anticipo (50%)</span><strong>$${anticipo.toLocaleString('es-MX')}</strong></div>
        <div class="cobro-split-item"><span>Saldo (50%)</span><strong>$${saldo.toLocaleString('es-MX')}</strong></div>
      </div>
      <button type="button" class="copy-btn" id="copyAnticipoBtn">📋 Copiar mensaje de anticipo</button>
      <button type="button" class="copy-btn" id="markAnticipoBtn">✓ Marcar anticipo recibido</button>
      <button type="button" class="copy-btn" id="copySaldoBtn">📋 Copiar mensaje de saldo/entrega</button>
      <button type="button" class="copy-btn" id="markSaldoBtn">✓ Marcar saldo recibido (100%)</button>
    `;

    const mensajeAnticipo = [
      `¡Hola! 👋 Tu pedido de *${pedidoActual.modelo}* (${cantidad} pza${cantidad>1?'s':''}) quedó registrado.`,
      `Código de seguimiento: *${pedidoActual.codigo}*`,
      ``,
      `💰 Total: $${total.toLocaleString('es-MX')} MXN`,
      `Para iniciar producción, el anticipo es de *$${anticipo.toLocaleString('es-MX')} MXN* (50%).`,
      ``,
      `Puedes transferir a:`,
      `${datos.banco} — ${datos.titular}`,
      `Cuenta/CLABE: ${datos.clabe}`,
      ``,
      envioGratis ? `🚚 Tu envío es gratis por ser una compra mayor a $1,000.` : null,
      `En cuanto veamos tu comprobante, arrancamos tu render 🎨`,
    ].filter(Boolean).join("\n");

    const mensajeSaldo = [
      `¡Hola! 👋 Tu exhibidor *${pedidoActual.modelo}* ya está listo.`,
      `Código de seguimiento: *${pedidoActual.codigo}*`,
      ``,
      `Para liberar tu pedido, el saldo restante es de *$${saldo.toLocaleString('es-MX')} MXN* (50%).`,
      ``,
      `Puedes transferir a:`,
      `${datos.banco} — ${datos.titular}`,
      `Cuenta/CLABE: ${datos.clabe}`,
      ``,
      `En cuanto confirmemos tu pago, coordinamos ${envioGratis ? 'tu envío' : 'tu entrega o envío'} 📦`,
    ].filter(Boolean).join("\n");

    function copiar(texto, btn){
      navigator.clipboard.writeText(texto).then(() => {
        const original = btn.textContent;
        btn.textContent = "✓ Copiado";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1500);
      });
    }

    document.getElementById("copyAnticipoBtn").addEventListener("click", (e) => copiar(mensajeAnticipo, e.target));
    document.getElementById("copySaldoBtn").addEventListener("click", (e) => copiar(mensajeSaldo, e.target));

    async function marcarPago(porcentaje, btn){
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Guardando...";
      try{
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion: "marcarPago", codigo: pedidoActual.codigo, porcentaje }),
        });
        const result = await response.json();
        if(result.ok){
          btn.textContent = "✓ Marcado en Sheets";
          btn.classList.add("copied");
        }else{
          alert("No se pudo marcar: " + (result.error || "error desconocido"));
          btn.textContent = original;
        }
      }catch(err){
        console.error(err);
        alert("No se pudo conectar. Intenta de nuevo.");
        btn.textContent = original;
      }finally{
        btn.disabled = false;
      }
    }

    document.getElementById("markAnticipoBtn").addEventListener("click", (e) => marcarPago(50, e.target));
    document.getElementById("markSaldoBtn").addEventListener("click", (e) => marcarPago(100, e.target));
  }
</script>

</body>
</html>
