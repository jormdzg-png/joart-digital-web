<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joart Digital — Asistente de Datos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream:#F4F1DE; --terracota:#E07A5F; --terracota-dark:#C4603F;
    --navy:#3D405B; --sage:#81B29A; --sand:#F2CC8F;
    --card:#FFFFFF; --line:#E3DFCB; --muted:#6E6C63;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; margin:0; }
  body{
    background:var(--navy); color:var(--cream);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  h1{ font-family:'Archivo Expanded',sans-serif; font-weight:800; margin:0; }

  header{
    padding:18px 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid rgba(244,241,222,.12); flex-shrink:0;
  }
  .top{ display:flex; align-items:center; gap:12px; }
  .top-mark{
    width:36px;height:36px; background:var(--terracota); color:white;
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Expanded',sans-serif; font-weight:800; font-size:15px;
    position:relative;
  }
  .top-mark::after{
    content:""; position:absolute; inset:-3px; border:1px solid rgba(224,122,95,.4);
  }
  .top-title{ font-size:15px; font-weight:700; }
  .top-tag{ font-size:11px; color:rgba(244,241,222,.55); display:flex; align-items:center; gap:6px; }
  .status-dot{ width:6px;height:6px; background:var(--sage); border-radius:50%; display:inline-block; }

  main{
    flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px;
    max-width:760px; width:100%; margin:0 auto;
  }

  .welcome{
    padding:28px 24px; text-align:center;
  }
  .welcome h1{ font-size:26px; margin-bottom:8px; }
  .welcome p{ font-size:13.5px; color:rgba(244,241,222,.6); max-width:40ch; margin:0 auto 26px; line-height:1.5; }

  .suggestions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .suggestion-chip{
    background:rgba(244,241,222,.06); border:1px solid rgba(244,241,222,.15);
    color:var(--cream); padding:9px 15px; font-size:12.5px; cursor:pointer;
    font-family:'Inter',sans-serif; transition:background .15s ease;
  }
  .suggestion-chip:hover{ background:rgba(244,241,222,.12); border-color:var(--terracota); }

  .msg{ display:flex; gap:12px; max-width:85%; }
  .msg.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar{
    width:30px;height:30px; flex-shrink:0; display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:800; font-family:'Archivo Expanded',sans-serif;
  }
  .msg.bot .msg-avatar{ background:var(--terracota); color:white; }
  .msg.user .msg-avatar{ background:rgba(244,241,222,.15); color:var(--cream); }
  .msg-bubble{
    padding:12px 16px; font-size:14px; line-height:1.55; white-space:pre-wrap;
  }
  .msg.bot .msg-bubble{ background:rgba(244,241,222,.06); border:1px solid rgba(244,241,222,.12); }
  .msg.user .msg-bubble{ background:var(--terracota); color:white; }
  .msg-bubble.error{ border-color:rgba(224,122,95,.4); color:#F6B99A; }

  .thinking{ display:flex; gap:5px; padding:4px 0; }
  .thinking span{
    width:6px;height:6px; background:rgba(244,241,222,.4); border-radius:50%;
    animation:pulse 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:.15s; }
  .thinking span:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }

  footer{
    padding:18px 24px 22px; border-top:1px solid rgba(244,241,222,.12); flex-shrink:0;
  }
  .input-row{
    max-width:760px; margin:0 auto; display:flex; gap:10px;
    background:rgba(244,241,222,.06); border:1px solid rgba(244,241,222,.15);
    padding:6px 6px 6px 16px; align-items:center;
  }
  .input-row input{
    flex:1; background:none; border:none; color:var(--cream); font-family:'Inter',sans-serif;
    font-size:14.5px; padding:10px 0;
  }
  .input-row input::placeholder{ color:rgba(244,241,222,.35); }
  .input-row input:focus{ outline:none; }
  .send-btn{
    background:var(--terracota); color:white; border:none; width:38px;height:38px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .send-btn:hover{ background:var(--terracota-dark); }
  .send-btn:disabled{ background:rgba(244,241,222,.15); cursor:not-allowed; }

  main::-webkit-scrollbar{ width:6px; }
  main::-webkit-scrollbar-thumb{ background:rgba(244,241,222,.15); }
  .lock-screen{
    position:fixed; inset:0; background:var(--navy); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:18px; text-align:center;
  }
  .lock-icon{
    width:52px;height:52px; background:rgba(244,241,222,.08); border:1px solid rgba(244,241,222,.15);
    display:flex;align-items:center;justify-content:center;
  }
  .lock-screen h2{ font-family:'Archivo Expanded',sans-serif; font-weight:800; font-size:20px; margin:0; }
  .lock-screen p{ font-size:13px; color:rgba(244,241,222,.55); margin:0; max-width:32ch; }
  .lock-form{ display:flex; gap:8px; width:100%; max-width:300px; }
  .lock-form input{
    flex:1; background:rgba(244,241,222,.06); border:1px solid rgba(244,241,222,.2);
    color:var(--cream); padding:11px 13px; font-family:'Inter',sans-serif; font-size:14px;
  }
  .lock-form input:focus{ outline:none; border-color:var(--terracota); }
  .lock-btn{
    background:var(--terracota); color:white; border:none; padding:0 18px;
    font-weight:700; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .lock-btn:hover{ background:var(--terracota-dark); }
  .lock-error{ font-size:12.5px; color:#F6B99A; min-height:16px; }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F1DE" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  </div>
  <div>
    <h2>Acceso restringido</h2>
    <p>Este asistente lee datos internos del negocio. Escribe la contraseña para continuar.</p>
  </div>
  <div class="lock-form">
    <input type="password" id="lockInput" placeholder="Contraseña">
    <button type="button" class="lock-btn" id="lockBtn">Entrar</button>
  </div>
  <div class="lock-error" id="lockError"></div>
</div>

<header>
  <div class="top">
    <div class="top-mark">J</div>
    <div>
      <div class="top-title">Joart Digital</div>
      <div class="top-tag"><span class="status-dot"></span>Asistente de Datos — en vivo</div>
    </div>
  </div>
</header>

<main id="chatMain">
  <div class="welcome" id="welcomeScreen">
    <h1>Pregúntame sobre tu negocio</h1>
    <p>Leo en vivo tu Base de datos, Proyectos, Precios y Balance — pregunta lo que necesites saber.</p>
    <div class="suggestions">
      <button class="suggestion-chip" data-q="¿Cuánto vendimos en agosto?">¿Cuánto vendimos en agosto?</button>
      <button class="suggestion-chip" data-q="¿Qué pedidos están pendientes de entrega esta semana?">Pendientes de esta semana</button>
      <button class="suggestion-chip" data-q="¿Cuál es el modelo que más se ha vendido?">Modelo más vendido</button>
      <button class="suggestion-chip" data-q="¿Cuántos pedidos tienen el 0% pagado todavía?">Pedidos sin anticipo</button>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <input type="text" id="chatInput" placeholder="Escribe tu pregunta...">
    <button type="button" class="send-btn" id="sendBtn" aria-label="Enviar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</footer>

<script>
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw2wvTODLwGZ07v7XcyWJ9Eyf5L8xZMwiFjed0qN3iAXWGVJ27KWb48ju5oWsGyXJwXbA/exec";

  const chatMain = document.getElementById("chatMain");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const welcomeScreen = document.getElementById("welcomeScreen");

  let passwordActual = null;

  const lockScreen = document.getElementById("lockScreen");
  const lockInput = document.getElementById("lockInput");
  const lockBtn = document.getElementById("lockBtn");
  const lockError = document.getElementById("lockError");

  async function intentarAcceso(){
    const intento = lockInput.value;
    if(!intento){
      lockError.textContent = "Escribe la contraseña.";
      return;
    }
    lockBtn.disabled = true;
    lockBtn.textContent = "Verificando...";
    lockError.textContent = "";

    try{
      // Se manda una "pregunta" vacía solo para validar la contraseña contra
      // el servidor sin gastar una consulta real a Gemini todavía.
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "preguntarBot", pregunta: "", password: intento }),
      });
      const result = await response.json();

      // "No llegó ninguna pregunta" significa que la contraseña SÍ fue
      // aceptada (pasó esa validación); cualquier otro error de contraseña
      // significa que fue rechazada.
      if(result.error === "No llegó ninguna pregunta" || result.ok){
        passwordActual = intento;
        lockScreen.style.display = "none";
        chatInput.focus();
      }else{
        lockError.textContent = "Contraseña incorrecta.";
      }
    }catch(e){
      console.error(e);
      lockError.textContent = "No se pudo verificar. Intenta de nuevo.";
    }finally{
      lockBtn.disabled = false;
      lockBtn.textContent = "Entrar";
    }
  }

  lockBtn.addEventListener("click", intentarAcceso);
  lockInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter") intentarAcceso();
  });

  function addMessage(texto, tipo, esError){
    const msg = document.createElement("div");
    msg.className = `msg ${tipo}`;
    msg.innerHTML = `
      <div class="msg-avatar">${tipo === "user" ? "Tú" : "IA"}</div>
      <div class="msg-bubble${esError ? " error" : ""}">${texto}</div>
    `;
    chatMain.appendChild(msg);
    chatMain.scrollTop = chatMain.scrollHeight;
    return msg;
  }

  function addThinking(){
    const msg = document.createElement("div");
    msg.className = "msg bot";
    msg.id = "thinkingMsg";
    msg.innerHTML = `
      <div class="msg-avatar">IA</div>
      <div class="msg-bubble"><div class="thinking"><span></span><span></span><span></span></div></div>
    `;
    chatMain.appendChild(msg);
    chatMain.scrollTop = chatMain.scrollHeight;
  }

  function removeThinking(){
    const el = document.getElementById("thinkingMsg");
    if(el) el.remove();
  }

  async function enviarPregunta(pregunta){
    if(!pregunta.trim()) return;

    if(welcomeScreen) welcomeScreen.remove();

    addMessage(pregunta, "user");
    chatInput.value = "";
    sendBtn.disabled = true;
    addThinking();

    try{
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "preguntarBot", pregunta, password: passwordActual }),
      });
      const result = await response.json();

      removeThinking();

      if(result.ok){
        addMessage(result.respuesta, "bot");
      }else{
        addMessage(result.error || "No se pudo obtener una respuesta.", "bot", true);
      }
    }catch(e){
      console.error(e);
      removeThinking();
      addMessage("No se pudo conectar. Intenta de nuevo.", "bot", true);
    }finally{
      sendBtn.disabled = false;
      chatInput.focus();
    }
  }

  sendBtn.addEventListener("click", () => enviarPregunta(chatInput.value));
  chatInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter") enviarPregunta(chatInput.value);
  });

  document.querySelectorAll(".suggestion-chip").forEach(chip => {
    chip.addEventListener("click", () => enviarPregunta(chip.dataset.q));
  });
</script>

</body>
</html>
